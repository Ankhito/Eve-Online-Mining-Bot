[SETTINGS]
# Sanderling is Windows-only; use coordinates for the legacy mode.
automation_mode = sanderling
# Remember the starting station and use system menus; no bookmarks needed.
auto_navigation = True
# Highest priority first, one exact ore name per indented line.
ore_priority =
allow_unlisted_ores = True
# Used only when auto_navigation is False.
home_bookmark_name = Home
mining_bookmark_prefix = Mining
# Set this to your actual laser range, not targeting range.
mining_range_m = 15000
# English asteroid names only by default. Matches overview labels.
asteroid_name_pattern = ^Asteroid\b
memory_read_timeout = 120
log_level = INFO
mining_runs = 
mining_hold = 
mining_yield = 
mining_reset_timer = 
hardener_keys = 
warping_time = 
unlock_all_targets_key = 
take_screenshots = False

